# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - easybilling-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2A2B7215A819414195A2413E2A66C3AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CC1E99C9F7242DF9A6796B79FF6C5F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A1421EF8A65B4CADBE354904EB47D1EB }}

      - name: Get runner public IP
        id: ip
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").ToString()
          "ip=$ip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Allow runner IP in Postgres firewall (Flexible Server)
        shell: pwsh
        run: |
          az postgres flexible-server firewall-rule create `
            --resource-group "${{ vars.PG_RESOURCE_GROUP }}" `
            --name "${{ vars.PG_SERVER_NAME }}" `
            --rule-name "gh-${{ github.run_id }}" `
            --start-ip-address "${{ steps.ip.outputs.ip }}" `
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Get connection string from Web App
        shell: pwsh
        run: |
          $conn = az webapp config connection-string list `
            -g "${{ vars.AZURE_RG }}" `
            -n "${{ vars.AZURE_WEBAPP_NAME }}" `
            --query "[?name=='AZURE_POSTGRESQL_CONNECTIONSTRING'].value | [0]" `
            -o tsv

          if (-not $conn) { throw "AZURE_POSTGRESQL_CONNECTIONSTRING not found on Web App." }

          "POSTGRES_CONNECTION_STRING=$conn" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set environment variables for migrations
        shell: pwsh
        run: |
          "ASPNETCORE_ENVIRONMENT=Production" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DOTNET_ENVIRONMENT=Production" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ConnectionStrings__DefaultConnection=$env:POSTGRES_CONNECTION_STRING" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run EF Core migrations (bundle)
        shell: pwsh
        run: |
          & ".\migrate\migrate.exe" --connection "$env:POSTGRES_CONNECTION_STRING"

      - name: Remove Postgres firewall rule (Flexible Server)
        shell: pwsh
        run: |
          az postgres flexible-server firewall-rule delete `
            --resource-group "${{ vars.PG_RESOURCE_GROUP }}" `
            --name "${{ vars.PG_SERVER_NAME }}" `
            --rule-name "gh-${{ github.run_id }}" `
            -y

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'easybilling-api'
          slot-name: 'Production'
          package: .
          